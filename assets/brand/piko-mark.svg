<!--
  Piko brand mark — concept B, "Notch".
  A soft square head with a slot cut out of its top edge, so the antenna is negative
  space, and two round eyes. White on transparent, for use on a dark ground; the black
  twin is piko-mark-dark.svg.

  The cuts are made with a <mask> rather than with `fill-rule="evenodd"` on one path:
  evenodd XORs overlapping subpaths, so the slot — which has to cross the outline to
  be a notch rather than a hole — would fill the part of itself hanging outside it.

  Shape is 512×512 with the mark centred and about 14% margin; piko-icon.svg is this
  mark on the app tile.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <mask id="piko-mark-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#FFFFFF"/>
      <rect x="208" y="56" width="96" height="80" rx="20" fill="#000000"/>
      <circle cx="196" cy="272" r="34" fill="#000000"/>
      <circle cx="316" cy="272" r="34" fill="#000000"/>
    </mask>
  </defs>

  <path fill="#FFFFFF" mask="url(#piko-mark-cut)" d="
    M432,256
    C432,383 383,432 256,432
    C129,432 80,383 80,256
    C80,129 129,80 256,80
    C383,80 432,129 432,256
    Z
  "/>
</svg>