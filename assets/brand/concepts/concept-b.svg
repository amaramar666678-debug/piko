<!--
  Piko — concept B: "Notch"
  The head has a slot cut out of its top edge, so the antenna is negative space. That
  slot is the identity: it is where a notch would be, and nothing else in this
  category has one — it is what stops this being a chat bubble with a face in it.

  The slot crosses the outline on purpose (a notch has to reach the outside), which
  is exactly what evenodd cannot do, so the cuts are made with a <mask>.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <mask id="b-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#FFFFFF"/>
      <rect x="208" y="56" width="96" height="80" rx="20" fill="#000000"/>
      <circle cx="196" cy="272" r="34" fill="#000000"/>
      <circle cx="316" cy="272" r="34" fill="#000000"/>
    </mask>
  </defs>

  <path fill="#FFFFFF" mask="url(#b-cut)" d="
    M432,256
    C432,383 383,432 256,432
    C129,432 80,383 80,256
    C80,129 129,80 256,80
    C383,80 432,129 432,256
    Z
  "/>
</svg>