<!--
  Piko — concept A on an app-icon tile.
  The same mark at 86% on a dark squircle, with a 1px inner hairline
  (4 units in this 512 space = 1px at the 128px the icon is usually seen at).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="a-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B1C22"/>
      <stop offset="1" stop-color="#121317"/>
    </linearGradient>
    <mask id="a-icon-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#FFFFFF"/>
      <rect x="176" y="200" width="52" height="112" rx="26" fill="#000000"/>
      <rect x="284" y="200" width="52" height="112" rx="26" fill="#000000"/>
    </mask>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#a-tile)"/>
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4"/>
  <g transform="translate(256 256) scale(0.86) translate(-256 -256)">
    <path fill="#FFFFFF" mask="url(#a-icon-cut)" d="
      M432,256
      C432,383 383,432 256,432
      C129,432 80,383 80,256
      C80,129 129,80 256,80
      C383,80 432,129 432,256
      Z
    "/>
  </g>
</svg>