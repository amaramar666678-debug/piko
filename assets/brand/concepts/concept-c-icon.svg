<!--
  Piko — concept C on an app-icon tile. The mark sits a little low in the tile, which
  is where it belongs: a dome on a flat base reads as standing on something.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="c-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B1C22"/>
      <stop offset="1" stop-color="#121317"/>
    </linearGradient>
    <mask id="c-icon-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#FFFFFF"/>
      <circle cx="196" cy="268" r="32" fill="#000000"/>
      <circle cx="316" cy="268" r="32" fill="#000000"/>
    </mask>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#c-tile)"/>
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4"/>
  <g transform="translate(256 316) scale(0.9) translate(-256 -316)" mask="url(#c-icon-cut)">
    <path fill="#FFFFFF" d="
      M80,340
      A176,176 0 0 1 432,340
      L80,340
      Z
    "/>
  </g>
</svg>